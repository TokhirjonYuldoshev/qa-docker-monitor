name: Stage Telegram workflow patch

on:
  push:
    branches: [ci/align-telegram-notification-style]

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ci/align-telegram-notification-style

      - name: Build patched workflow copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/main.yml')
          text = source.read_text(encoding='utf-8')
          marker = '          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then\n'
          if text.count(marker) != 1:
              raise SystemExit(f'Expected exactly one Telegram script marker, found {text.count(marker)}')
          index = text.index(marker)
          body = r'''if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
          echo "::notice::Telegram secrets не настроены; уведомление пропущено."
          {
          echo "## ✈️ Telegram"
          echo
          echo "ℹ️ Уведомление пропущено: настройте TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID; legacy TG_TOKEN / TG_CHAT_ID тоже поддерживаются."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
          fi
          
          result_label() {
          case "$1" in
          success) echo "✅ Успешно" ;;
          failure) echo "❌ Ошибка" ;;
          cancelled) echo "⏹️ Отменено" ;;
          skipped) echo "⏭️ Пропущено" ;;
          *) echo "❔ ${1:-unknown}" ;;
          esac
          }
          
          event_label() {
          case "$1" in
          push) echo "Push в репозиторий" ;;
          workflow_dispatch) echo "Ручной запуск" ;;
          schedule) echo "Плановый health check" ;;
          *) echo "$1" ;;
          esac
          }
          
          escape_html() {
          local text="$1"
          text="${text//&/&amp;}"
          text="${text//</&lt;}"
          text="${text//>/&gt;}"
          printf '%s' "$text"
          }
          
          if [[ "$GATE_RESULT" == "failure" ]]; then
          OVERALL_ICON="❌"
          OVERALL_TITLE="МОНИТОРИНГ ТРЕБУЕТ ВНИМАНИЯ"
          OVERALL_SUBTITLE="Один или несколько обязательных сигналов завершились с ошибкой"
          elif [[ "$GATE_RESULT" == "cancelled" ]]; then
          OVERALL_ICON="⏹️"
          OVERALL_TITLE="ЗАПУСК ОТМЕНЁН"
          OVERALL_SUBTITLE="Выполнение мониторинга было остановлено"
          elif [[ "$GATE_RESULT" == "success" ]]; then
          OVERALL_ICON="✅"
          OVERALL_TITLE="МОНИТОРИНГ ИСПРАВЕН"
          OVERALL_SUBTITLE="PostgreSQL write/read health подтверждён"
          else
          OVERALL_ICON="⚠️"
          OVERALL_TITLE="МОНИТОРИНГ ЗАВЕРШЁН НЕ ПОЛНОСТЬЮ"
          OVERALL_SUBTITLE="Часть сигналов была пропущена или не завершилась"
          fi
          
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          REPOSITORY_HTML="$(escape_html "$GITHUB_REPOSITORY")"
          BRANCH_HTML="$(escape_html "$BRANCH")"
          ACTOR_HTML="$(escape_html "$GITHUB_ACTOR")"
          EVENT_HTML="$(escape_html "$(event_label "$GITHUB_EVENT_NAME")")"
          
          MESSAGE=$(cat <<EOF
          <b>QA Database Health Monitor</b>
          <i>Мониторинг PostgreSQL write/read и Windows-контракта</i>
          
          ━━━━━━━━━━━━━━
          ${OVERALL_ICON} <b>${OVERALL_TITLE}</b>
          <i>${OVERALL_SUBTITLE}</i>
          ━━━━━━━━━━━━━━
          
          📦 <b>Репозиторий</b>
          <code>${REPOSITORY_HTML}</code>
          
          🌿 <b>Ветка</b>
          <code>${BRANCH_HTML}</code>
          
          ⚡ <b>Событие:</b> ${EVENT_HTML}
          👤 <b>Автор:</b> ${ACTOR_HTML}
          
          📋 <b>Результаты проверок</b>
          <blockquote>$(result_label "$DATABASE_RESULT")  PostgreSQL write/read health
          $(result_label "$WINDOWS_RESULT")  Windows monitor contract
          $(result_label "$GATE_RESULT")  Обязательный CI gate</blockquote>
          
          🔗 <a href="${RUN_URL}"><b>Открыть запуск в GitHub Actions</b></a>
          <i>Запуск #${GITHUB_RUN_NUMBER}</i>
          EOF
          )
          
          HTTP_CODE="$(curl --silent --show-error \
          --retry 2 \
          --retry-all-errors \
          --connect-timeout 10 \
          --max-time 20 \
          --output /tmp/telegram-response.json \
          --write-out '%{http_code}' \
          --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
          --data-urlencode "text=${MESSAGE}" \
          --data-urlencode "parse_mode=HTML" \
          --data-urlencode "disable_web_page_preview=true" \
          "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" || true)"
          
          if [[ "$HTTP_CODE" != "200" ]] || ! jq -e '.ok == true' /tmp/telegram-response.json >/dev/null 2>&1; then
          echo "::warning::Telegram sendMessage не подтвердил доставку (HTTP ${HTTP_CODE:-transport-error}). Результат мониторинга сохранён."
          {
          echo "## ✈️ Telegram"
          echo
          echo "⚠️ Результат мониторинга сохранён, но Telegram не подтвердил доставку уведомления."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
          fi
          
          {
          echo "## ✈️ Telegram"
          echo
          echo "✅ Итог мониторинга отправлен в Telegram в едином формате портфолио."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Telegram notification sent."'''
          lines = body.splitlines()
          replacement = '\n'.join(('          ' + line if line else '') for line in lines) + '\n'
          Path('tmp-main-patched.yml').write_text(text[:index] + replacement, encoding='utf-8')
          PY

      - name: Validate and commit staged copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('tmp-main-patched.yml').read_text(encoding='utf-8')
          required = [
              '          <b>QA Database Health Monitor</b>',
              '          ━━━━━━━━━━━━━━',
              '          <blockquote>$(result_label "$DATABASE_RESULT")  PostgreSQL write/read health',
              '          --retry 2',
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'Missing expected staged fragment: {item!r}')
          if '\n  echo "::notice::Telegram secrets' in text:
              raise SystemExit('Detected broken YAML indentation in staged workflow')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-main-patched.yml
          git commit -m "chore: prepare validated Telegram workflow patch"
          git push origin HEAD:ci/align-telegram-notification-style
