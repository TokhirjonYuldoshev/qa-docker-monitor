name: Cloud QA Monitor 🚀

# ТРИГГЕРЫ: Когда запускать?
on:
  push:
    branches: [ main ]          # Запуск при пуше в основную ветку
  workflow_dispatch:           # Кнопка ручного запуска
  schedule:
    - cron: '*/10 * * * *'     # Каждые 10 минут

# Настройка окружения, чтобы убрать предупреждения о Node.js
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-database:
    runs-on: ubuntu-latest

    # Создаем временную базу данных для теста
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_PASSWORD: mysecretpassword
        ports:
          - 5432:5432
        # Проверка здоровья: ждем готовности
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Скачиваем код из репозитория
        uses: actions/checkout@v4

      - name: ⏳ Страховочная пауза
        run: sleep 10

      - name: 🛠 Установка клиента Postgres
        run: sudo apt-get install -y postgresql-client

      - name: 🧪 ЗАПУСК ТЕСТА (SQL Insert)
        env:
          PGPASSWORD: mysecretpassword
        run: |
          # 1. Создаем таблицу, если её нет
          psql -h localhost -U postgres -c "CREATE TABLE IF NOT EXISTS robot_log (id SERIAL PRIMARY KEY, status TEXT, visit_time TIMESTAMP DEFAULT NOW());"
          
          # 2. Пробуем вставить данные
          psql -h localhost -U postgres -c "INSERT INTO robot_log (status) VALUES ('GitHub Cloud Test - OK');"

      - name: ✅ УСПЕХ - Отправка в Telegram
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -X POST https://api.telegram.org/bot$TG_TOKEN/sendMessage \
          -d chat_id=$TG_CHAT_ID \
          -d text="☁️ CLOUD: Success! System is healthy."

      - name: 🚨 ОШИБКА - Отправка в Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -X POST https://api.telegram.org/bot$TG_TOKEN/sendMessage \
          -d chat_id=$TG_CHAT_ID \
          -d text="🔥 CLOUD: ALERT! Test failed. Database is down."
