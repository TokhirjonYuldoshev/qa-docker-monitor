name: QA Database Health Monitor
run-name: "QA Database Health Monitor • ${{ github.head_ref || github.ref_name }} • ${{ github.actor }}"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9,21 * * *"

permissions:
  contents: read

concurrency:
  group: qa-database-health-monitor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  database-health:
    name: PostgreSQL write/read health check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: qa_monitor_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run SQL write/read health check
        id: database_check
        continue-on-error: true
        env:
          PGPASSWORD: qa_monitor_password
        run: |
          set -euo pipefail
          RUN_MARKER="GitHub Cloud Test - ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE IF NOT EXISTS robot_log (id SERIAL PRIMARY KEY, status TEXT, visit_time TIMESTAMP DEFAULT NOW());"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c \
            "INSERT INTO robot_log (status) VALUES ('${RUN_MARKER}');"
          MATCH_COUNT="$(psql -h localhost -U postgres -v ON_ERROR_STOP=1 -Atc \
            "SELECT count(*) FROM robot_log WHERE status = '${RUN_MARKER}';")"
          if [[ "$MATCH_COUNT" != "1" ]]; then
            echo "Expected exactly one persisted health marker, got: $MATCH_COUNT" >&2
            exit 1
          fi
          echo "Verified persisted PostgreSQL marker: ${RUN_MARKER}"

      - name: Publish health summary
        if: always()
        env:
          HEALTH_OUTCOME: ${{ steps.database_check.outcome }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          status_ru() {
            case "$1" in
              success) echo "✅ Успешно" ;;
              failure) echo "❌ Ошибка" ;;
              cancelled) echo "⏹️ Отменено" ;;
              skipped) echo "⏭️ Пропущено" ;;
              *) echo "❔ ${1:-not-run}" ;;
            esac
          }
          {
            echo "## PostgreSQL write/read health"
            echo
            echo "- Результат: **$(status_ru "${HEALTH_OUTCOME:-not-run}")**"
            echo "- Проверка: readiness + SQL CREATE/INSERT + read-back assertion"
            echo "- Trigger: ${EVENT_NAME}"
            echo "- Schedule: 09:00 и 21:00 UTC"
            echo "- Source of truth: persisted PostgreSQL write/read result"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce database health result
        if: ${{ always() && steps.database_check.outcome != 'success' }}
        run: |
          echo "PostgreSQL write/read health check did not succeed." >&2
          exit 1

  windows-contract:
    name: Windows monitor contract
    if: ${{ github.event_name != 'schedule' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create isolated command doubles
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .qa-test-bin | Out-Null
          @'
          @echo off
          if defined MOCK_DOCKER_OUTPUT echo %MOCK_DOCKER_OUTPUT%
          exit /b %MOCK_DOCKER_EXIT%
          '@ | Set-Content -Encoding ascii .qa-test-bin/docker.cmd
          @'
          @echo off
          exit /b %MOCK_CURL_EXIT%
          '@ | Set-Content -Encoding ascii .qa-test-bin/curl.cmd
          (Resolve-Path .qa-test-bin).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify monitor exit-code contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-MonitorScenario {
            param(
              [Parameter(Mandatory = $true)][string]$Name,
              [Parameter(Mandatory = $true)][int]$DockerExit,
              [Parameter(Mandatory = $true)][string]$DockerOutput,
              [Parameter(Mandatory = $true)][int]$CurlExit,
              [Parameter(Mandatory = $true)][bool]$EnableTelegram,
              [Parameter(Mandatory = $true)][int]$ExpectedExit
            )

            $env:MOCK_DOCKER_EXIT = "$DockerExit"
            $env:MOCK_DOCKER_OUTPUT = $DockerOutput
            $env:MOCK_CURL_EXIT = "$CurlExit"
            $env:BUILD_NUMBER = 'contract-test'
            $env:RUN_TOKEN = 'contract'
            $env:DB_CONTAINER = 'qa-contract-postgres'

            if ($EnableTelegram) {
              $env:TOKEN = 'test-token'
              $env:CHAT_ID = 'test-chat'
            } else {
              Remove-Item Env:TOKEN -ErrorAction SilentlyContinue
              Remove-Item Env:CHAT_ID -ErrorAction SilentlyContinue
            }

            & cmd.exe /d /c monitor.bat
            $actualExit = $LASTEXITCODE
            if ($actualExit -ne $ExpectedExit) {
              throw "Scenario '$Name' expected exit $ExpectedExit but got $actualExit"
            }
            Write-Host "PASS: $Name -> exit $actualExit"
          }

          $expectedStatus = 'Build #contract-test - OK [contract]'
          Invoke-MonitorScenario -Name 'database-success-without-telegram' -DockerExit 0 -DockerOutput $expectedStatus -CurlExit 0 -EnableTelegram $false -ExpectedExit 0
          Invoke-MonitorScenario -Name 'database-success-notification-failure' -DockerExit 0 -DockerOutput $expectedStatus -CurlExit 1 -EnableTelegram $true -ExpectedExit 0
          Invoke-MonitorScenario -Name 'database-readback-mismatch' -DockerExit 0 -DockerOutput 'unexpected persisted value' -CurlExit 0 -EnableTelegram $false -ExpectedExit 1
          Invoke-MonitorScenario -Name 'database-failure-notification-failure' -DockerExit 1 -DockerOutput 'unused' -CurlExit 1 -EnableTelegram $true -ExpectedExit 1
          exit 0

      - name: Publish contract summary
        shell: pwsh
        run: |
          @'
          ## Windows monitor contract

          - DB write/read success + Telegram disabled: **exit 0**
          - DB write/read success + Telegram failure: **exit 0**
          - DB read-back mismatch: **exit 1**
          - DB command failure + Telegram failure: **exit 1**
          - Read-back marker: **isolated per run**
          - Source of truth: **persisted PostgreSQL write/read result**
          '@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

  gate:
    name: CI / Required gate
    if: ${{ always() }}
    needs: [database-health, windows-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish aggregate monitoring summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          DATABASE_RESULT: ${{ needs.database-health.result }}
          WINDOWS_RESULT: ${{ needs.windows-contract.result }}
        run: |
          status_ru() {
            case "$1" in
              success) echo "✅ Успешно" ;;
              failure) echo "❌ Ошибка" ;;
              cancelled) echo "⏹️ Отменено" ;;
              skipped) echo "⏭️ Пропущено" ;;
              *) echo "❔ ${1:-unknown}" ;;
            esac
          }

          if [[ "$DATABASE_RESULT" == success && ( "$EVENT_NAME" == schedule || "$WINDOWS_RESULT" == success ) ]]; then
            OVERALL="✅ МОНИТОРИНГ ИСПРАВЕН"
          else
            OVERALL="❌ МОНИТОРИНГ ТРЕБУЕТ ВНИМАНИЯ"
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # QA Database Health Monitor — итог

          ## ${OVERALL}

          | Сигнал | Статус |
          | --- | --- |
          | PostgreSQL write/read health | $(status_ru "$DATABASE_RESULT") |
          | Windows monitor contract | $(status_ru "$WINDOWS_RESULT") |

          **Trigger:** `${EVENT_NAME}` · **Ветка:** `${BRANCH}` · **Commit:** `${SHORT_SHA}`  
          **Run:** [открыть GitHub Actions](${RUN_URL})

          > ✈️ Telegram — вспомогательный observability channel. Он не может превратить исправную БД в ложный failure и не может скрыть реальную ошибку health check.
          EOF

      - name: Enforce aggregate result
        env:
          EVENT_NAME: ${{ github.event_name }}
          DATABASE_RESULT: ${{ needs.database-health.result }}
          WINDOWS_RESULT: ${{ needs.windows-contract.result }}
        run: |
          set -euo pipefail
          if [[ "$DATABASE_RESULT" != 'success' ]]; then
            echo "PostgreSQL write/read health job finished with: $DATABASE_RESULT" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" != 'schedule' && "$WINDOWS_RESULT" != 'success' ]]; then
            echo "Windows monitor contract finished with: $WINDOWS_RESULT" >&2
            exit 1
          fi

  notify:
    name: Telegram Notification
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [database-health, windows-contract, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send monitoring result to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TG_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TG_CHAT_ID }}
          DATABASE_RESULT: ${{ needs.database-health.result }}
          WINDOWS_RESULT: ${{ needs.windows-contract.result }}
          GATE_RESULT: ${{ needs.gate.result }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::notice::Telegram secrets are not configured; notification skipped."
            {
              echo "## ✈️ Telegram"
              echo
              echo "ℹ️ Уведомление пропущено: настройте TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID; legacy TG_TOKEN / TG_CHAT_ID тоже поддерживаются."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          status_ru() {
            case "$1" in
              success) echo "✅ Успешно" ;;
              failure) echo "❌ Ошибка" ;;
              cancelled) echo "⏹️ Отменено" ;;
              skipped) echo "⏭️ Пропущено" ;;
              *) echo "❔ ${1:-unknown}" ;;
            esac
          }

          event_ru() {
            case "$1" in
              push) echo "Push в main" ;;
              workflow_dispatch) echo "Ручной запуск" ;;
              schedule) echo "Плановый health check" ;;
              *) echo "$1" ;;
            esac
          }

          escape_html() {
            local text="$1"
            text="${text//&/&amp;}"
            text="${text//</&lt;}"
            text="${text//>/&gt;}"
            printf '%s' "$text"
          }

          if [[ "$GATE_RESULT" == success ]]; then
            HEADER="✅ <b>PostgreSQL Monitor — HEALTHY</b>"
          else
            HEADER="🚨 <b>PostgreSQL Monitor — ALERT</b>"
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          REPO="$(escape_html "$GITHUB_REPOSITORY")"
          BRANCH="$(escape_html "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}")"
          ACTOR="$(escape_html "$GITHUB_ACTOR")"
          EVENT="$(escape_html "$(event_ru "$GITHUB_EVENT_NAME")")"
          SHORT_SHA="${GITHUB_SHA:0:7}"

          MESSAGE="${HEADER}"
          MESSAGE+=$'\n\n'"🗄️ <b>База:</b> PostgreSQL 16"
          MESSAGE+=$'\n'"📦 <b>Репозиторий:</b> <code>${REPO}</code>"
          MESSAGE+=$'\n'"🌿 <b>Ветка:</b> <code>${BRANCH}</code>"
          MESSAGE+=$'\n'"🔄 <b>Запуск:</b> ${EVENT}"
          MESSAGE+=$'\n'"👤 <b>Автор:</b> <code>${ACTOR}</code>"
          MESSAGE+=$'\n'"🔖 <b>Commit:</b> <code>${SHORT_SHA}</code>"
          MESSAGE+=$'\n\n'"🧪 <b>Сигналы</b>"
          MESSAGE+=$'\n'"• PostgreSQL write/read health: $(status_ru "$DATABASE_RESULT")"
          MESSAGE+=$'\n'"• Windows monitor contract: $(status_ru "$WINDOWS_RESULT")"
          MESSAGE+=$'\n'"• Required gate: $(status_ru "$GATE_RESULT")"
          MESSAGE+=$'\n\n'"🔗 <a href=\"${RUN_URL}\">Открыть GitHub Actions run #${GITHUB_RUN_NUMBER}</a>"

          HTTP_CODE="$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            --output /tmp/telegram-response.json \
            --write-out '%{http_code}' \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${MESSAGE}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" || true)"

          if [[ "$HTTP_CODE" != "200" ]] || ! jq -e '.ok == true' /tmp/telegram-response.json >/dev/null 2>&1; then
            echo "::warning::Telegram sendMessage failed (HTTP ${HTTP_CODE:-transport-error}). Monitoring result is preserved."
            {
              echo "## ✈️ Telegram"
              echo
              echo "⚠️ Health result сохранён, но Telegram transport не подтвердил доставку."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## ✈️ Telegram"
            echo
            echo "✅ Итог мониторинга отправлен в Telegram."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Telegram notification sent."
