name: QA Database Health Monitor

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9,21 * * *"

permissions:
  contents: read

concurrency:
  group: qa-database-health-monitor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  database-health:
    name: PostgreSQL write health check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: qa_monitor_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run SQL write health check
        id: database_check
        continue-on-error: true
        env:
          PGPASSWORD: qa_monitor_password
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE IF NOT EXISTS robot_log (id SERIAL PRIMARY KEY, status TEXT, visit_time TIMESTAMP DEFAULT NOW());"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c \
            "INSERT INTO robot_log (status) VALUES ('GitHub Cloud Test - OK');"

      - name: Send success notification to Telegram
        if: ${{ always() && github.event_name != 'pull_request' && steps.database_check.outcome == 'success' }}
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [[ -z "$TG_TOKEN" || -z "$TG_CHAT_ID" ]]; then
            echo "::notice::Telegram secrets are not configured; success notification skipped."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=☁️ CLOUD: Success! PostgreSQL write health check passed."

      - name: Send failure notification to Telegram
        if: ${{ always() && github.event_name != 'pull_request' && steps.database_check.outcome != 'success' }}
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [[ -z "$TG_TOKEN" || -z "$TG_CHAT_ID" ]]; then
            echo "::notice::Telegram secrets are not configured; failure notification skipped."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=🔥 CLOUD: ALERT! PostgreSQL write health check failed or could not run."

      - name: Publish health summary
        if: always()
        env:
          HEALTH_OUTCOME: ${{ steps.database_check.outcome }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## PostgreSQL health check"
            echo
            echo "- Result: **${HEALTH_OUTCOME:-not-run}**"
            echo "- Validation: PostgreSQL readiness + real SQL CREATE/INSERT"
            echo "- Trigger: ${EVENT_NAME}"
            echo "- Schedule: 09:00 and 21:00 UTC"
            echo "- Telegram: auxiliary notification channel; skipped for pull requests"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce database health result
        if: ${{ always() && steps.database_check.outcome != 'success' }}
        run: |
          echo "PostgreSQL write health check did not succeed." >&2
          exit 1

  windows-contract:
    name: Windows monitor contract
    if: ${{ github.event_name != 'schedule' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create isolated command doubles
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .qa-test-bin | Out-Null
          @'
          @echo off
          exit /b %MOCK_DOCKER_EXIT%
          '@ | Set-Content -Encoding ascii .qa-test-bin/docker.cmd
          @'
          @echo off
          exit /b %MOCK_CURL_EXIT%
          '@ | Set-Content -Encoding ascii .qa-test-bin/curl.cmd
          (Resolve-Path .qa-test-bin).Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify monitor exit-code contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-MonitorScenario {
            param(
              [Parameter(Mandatory = $true)][string]$Name,
              [Parameter(Mandatory = $true)][int]$DockerExit,
              [Parameter(Mandatory = $true)][int]$CurlExit,
              [Parameter(Mandatory = $true)][bool]$EnableTelegram,
              [Parameter(Mandatory = $true)][int]$ExpectedExit
            )

            $env:MOCK_DOCKER_EXIT = "$DockerExit"
            $env:MOCK_CURL_EXIT = "$CurlExit"
            $env:BUILD_NUMBER = 'contract-test'
            $env:DB_CONTAINER = 'qa-contract-postgres'

            if ($EnableTelegram) {
              $env:TOKEN = 'test-token'
              $env:CHAT_ID = 'test-chat'
            } else {
              Remove-Item Env:TOKEN -ErrorAction SilentlyContinue
              Remove-Item Env:CHAT_ID -ErrorAction SilentlyContinue
            }

            & cmd.exe /d /c monitor.bat
            $actualExit = $LASTEXITCODE
            if ($actualExit -ne $ExpectedExit) {
              throw "Scenario '$Name' expected exit $ExpectedExit but got $actualExit"
            }
            Write-Host "PASS: $Name -> exit $actualExit"
          }

          Invoke-MonitorScenario -Name 'database-success-without-telegram' -DockerExit 0 -CurlExit 0 -EnableTelegram $false -ExpectedExit 0
          Invoke-MonitorScenario -Name 'database-success-notification-failure' -DockerExit 0 -CurlExit 1 -EnableTelegram $true -ExpectedExit 0
          Invoke-MonitorScenario -Name 'database-failure-notification-failure' -DockerExit 1 -CurlExit 1 -EnableTelegram $true -ExpectedExit 1
          exit 0

      - name: Publish contract summary
        shell: pwsh
        run: |
          @'
          ## Windows monitor contract

          - DB success + Telegram disabled: **exit 0**
          - DB success + Telegram failure: **exit 0**
          - DB failure + Telegram failure: **exit 1**
          - Health source of truth: **PostgreSQL write result**
          '@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

  gate:
    name: CI / Required gate
    if: ${{ always() }}
    needs: [database-health, windows-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish aggregate monitoring summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          DATABASE_RESULT: ${{ needs.database-health.result }}
          WINDOWS_RESULT: ${{ needs.windows-contract.result }}
        run: |
          {
            echo "## Monitoring quality gate"
            echo
            echo "- PostgreSQL write health: **${DATABASE_RESULT}**"
            echo "- Windows monitor contract: **${WINDOWS_RESULT}**"
            echo "- Trigger: **${EVENT_NAME}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce aggregate result
        env:
          EVENT_NAME: ${{ github.event_name }}
          DATABASE_RESULT: ${{ needs.database-health.result }}
          WINDOWS_RESULT: ${{ needs.windows-contract.result }}
        run: |
          set -euo pipefail
          if [[ "$DATABASE_RESULT" != 'success' ]]; then
            echo "PostgreSQL write health job finished with: $DATABASE_RESULT" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" != 'schedule' && "$WINDOWS_RESULT" != 'success' ]]; then
            echo "Windows monitor contract finished with: $WINDOWS_RESULT" >&2
            exit 1
          fi
