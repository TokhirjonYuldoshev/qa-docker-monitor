name: QA Database Health Monitor

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9,21 * * *"

permissions:
  contents: read

concurrency:
  group: qa-database-health-monitor
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  database-health:
    name: PostgreSQL write health check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: qa_monitor_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run SQL write health check
        env:
          PGPASSWORD: qa_monitor_password
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c \
            "CREATE TABLE IF NOT EXISTS robot_log (id SERIAL PRIMARY KEY, status TEXT, visit_time TIMESTAMP DEFAULT NOW());"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c \
            "INSERT INTO robot_log (status) VALUES ('GitHub Cloud Test - OK');"

      - name: Send success notification to Telegram
        if: success()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=☁️ CLOUD: Success! PostgreSQL write health check passed."

      - name: Send failure notification to Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=🔥 CLOUD: ALERT! PostgreSQL write health check failed."
