name: Инцидент мониторинга
description: Зафиксировать PostgreSQL health, Windows contract, CI gate, runner/platform или observability incident с evidence и владельцем сигнала.
title: "[Incident] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Используйте эту форму для monitoring incidents и CI regressions. Сначала определите owning signal, затем предлагайте исправление. Ошибка только Telegram относится к observability, если обязательный health signal остаётся зелёным.

  - type: dropdown
    id: signal
    attributes:
      label: Владелец сигнала
      description: Какой сигнал является source of truth для этого инцидента?
      options:
        - PostgreSQL write/read health
        - Windows monitor contract
        - CI / Required gate
        - GitHub Actions runner/platform
        - Только Telegram observability
        - Неизвестно / нужен triage
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - SEV-1 — подтверждённый повторяющийся database-health failure
        - SEV-2 — regression обязательного contract/gate на main
        - SEV-3 — observability/notification failure при зелёном health gate
        - SEV-4 — проблема документации или отображения Summary
    validations:
      required: true

  - type: input
    id: run
    attributes:
      label: GitHub Actions run
      description: Укажите URL или run ID, если он доступен.
      placeholder: https://github.com/.../actions/runs/...

  - type: input
    id: revision
    attributes:
      label: Revision / branch
      placeholder: main @ abc1234
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Фактическое поведение
      description: Укажите, что именно сломалось: exit code, SQL/read-back result или contract scenario.
      placeholder: Опишите failure и первый owning job, который стал красным.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение / инвариант
      description: Опишите контракт, который должен выполняться.
      placeholder: CREATE -> INSERT -> SELECT возвращает ровно один marker текущего запуска; либо ожидаемый monitor exit-code contract.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Приложите релевантные logs, Summary, точную команду/результат, screenshots или platform evidence. Не вставляйте secrets.
      placeholder: Минимальное evidence, подтверждающее классификацию.
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: Воспроизводимость
      options:
        - Стабильно воспроизводится
        - Периодически
        - Один случай
        - Неизвестно
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Влияние и область
      description: Объясните, какая операция или уверенность затронута и что остаётся исправным.
      placeholder: Scheduled PostgreSQL health затронут; Telegram исправен/не относится; PR contract проходит и т.д.
    validations:
      required: true

  - type: checkboxes
    id: triage
    attributes:
      label: Дисциплина triage
      options:
        - label: Я определил первый owning signal, а не только финальное уведомление.
          required: true
        - label: Я сохранил исходный failed run/evidence.
          required: true
        - label: Я не добавлял произвольные sleeps, retries или suppression уведомлений как workaround.
          required: true
        - label: Я не включил credentials, tokens или другие secrets в Issue.
          required: true
